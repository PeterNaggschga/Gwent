name: Deploy documentation

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-documentation:
    uses: ./.github/workflows/docs-build.yml
    permissions:
      contents: read
    with:
      upload-artifact: true

  update-documentation:
    needs: build-documentation
    runs-on: ubuntu-latest
    outputs:
      SHA: ${{ steps.sha.outputs.SHA }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Remove old documentation
        run: rm -rf docs/html docs/documentation.pdf

      - name: Download generated documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: docs

      - name: Push changes
        uses: actions-x/commit@v6
        with:
          name: github-actions
          email: action@github.com
          message: updated reference documentation
          files: docs
          force: true

      - name: Get SHA
        id: sha
        run: |
          sha_new=$(git rev-parse HEAD)
          echo "SHA=$sha_new" >> "$GITHUB_OUTPUT"
      
  rebase-dev:
    needs: update-documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Rebase dev onto documentation commit and push
        env:
          DOCUMENTATION_SHA: ${{ needs.update-documentation.outputs.SHA }}
        run: |
          git config user.name github-actions
          git config user.email action@github.com
          dev_sha=$(git rev-parse refs/remotes/origin/dev)
          git rebase "$DOCUMENTATION_SHA"
          git push --force-with-lease="refs/heads/dev:$dev_sha" origin HEAD:refs/heads/dev

  deploy:
    needs: update-documentation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: ./docs/html
          ref: ${{ needs.update-documentation.outputs.SHA }}

      - name: Setup Pages
        uses: actions/configure-pages@v6
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs/html'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
